<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SALC 할로윈 파티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen night stage — round counter and tally in the top corners, the game name as a marquee,
   six candy tiles center stage, a navigation rail along the bottom. Single dark "midnight candy shop" look. */
:root{
  --night:#150D21;
  --night-raised:#211631;
  --night-high:#2D2042;
  --bone:#F6EDDB;
  --mist:#AA9EC0;
  --pumpkin:#FF7B1C;
  --pumpkin-deep:#A84A06;
  --moon:#FFE5A0;
  --line:rgba(246,237,219,.14);
  --candy-ink:#1C1027;
  --win:#8BE05C;
  --win-deep:#4C8F2B;
  --miss:#FF6178;
  --bat:#35264D;
  --drop:#0C0614;
  --t1:#FF8B2B; --t2:#AE7DFF; --t3:#7FD84C; --t4:#FF5774; --t5:#4CCDE2; --t6:#FFD447;
  --font-display:"Bagel Fat One","Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-ui:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --radius-tile:22px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  color:var(--bone);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.5;
  background:
    radial-gradient(900px 600px at 6% 112%, rgba(174,125,255,.16), transparent 65%),
    radial-gradient(700px 520px at 104% 104%, rgba(255,123,28,.12), transparent 60%),
    var(--night);
  background-attachment:fixed;
  overflow-x:hidden;
}
button{font:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

/* ---------- atmosphere ---------- */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky::before{
  content:"";position:absolute;inset:0;opacity:.7;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,240,210,.8), transparent 60%),
    radial-gradient(1.2px 1.2px at 28% 8%, rgba(255,240,210,.7), transparent 60%),
    radial-gradient(1.6px 1.6px at 44% 22%, rgba(255,240,210,.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 63% 12%, rgba(255,240,210,.8), transparent 60%),
    radial-gradient(1.4px 1.4px at 74% 30%, rgba(255,240,210,.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 8% 44%, rgba(255,240,210,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 92% 52%, rgba(255,240,210,.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 36% 66%, rgba(255,240,210,.4), transparent 60%),
    radial-gradient(1.4px 1.4px at 82% 78%, rgba(255,240,210,.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 18% 86%, rgba(255,240,210,.4), transparent 60%);
}
.moon{
  position:absolute;top:-110px;right:-80px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle at 38% 40%, #FFF6DB 0%, var(--moon) 45%, #E2B85C 100%);
  opacity:.13;box-shadow:0 0 140px 50px rgba(255,229,160,.18);
}
.bat-wrap{position:absolute;left:-90px;color:var(--bat)}
.bat-wrap svg{display:block;width:100%;height:auto;animation:flap .42s ease-in-out infinite alternate;transform-origin:50% 40%}
.bw1{top:16%;width:62px;animation:fly 28s linear infinite}
.bw2{top:61%;width:42px;animation:fly 36s linear 9s infinite}
.bw3{top:36%;width:52px;animation:fly 31s linear 18s infinite}
@keyframes fly{
  0%{transform:translate(0,0)}
  25%{transform:translate(28vw,-34px)}
  50%{transform:translate(56vw,18px)}
  75%{transform:translate(84vw,-22px)}
  100%{transform:translate(calc(100vw + 180px),0)}
}
@keyframes flap{to{transform:scaleY(.5)}}

/* ---------- frame ---------- */
#app{
  position:relative;z-index:1;
  box-sizing:border-box;min-height:100%;
  max-width:1240px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 14px;
}
.eyebrow{margin:0;font:700 13px/1.2 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--pumpkin)}

.topbar{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);
  grid-template-areas:"round title tally";align-items:start;gap:12px;
}
.round-badge{
  grid-area:round;justify-self:start;display:flex;flex-direction:column;gap:3px;
  padding:10px 16px 8px;border-radius:16px;border:1px solid var(--line);background:rgba(33,22,49,.78);
}
.rb-label{font:700 11px/1 var(--font-ui);letter-spacing:.22em;color:var(--mist)}
.rb-val{font-family:var(--font-display);font-size:24px;line-height:1.1;color:var(--bone);white-space:nowrap;font-variant-numeric:tabular-nums}
.rb-val b{font-weight:400;font-size:42px;color:var(--pumpkin)}
.rb-val small{font-size:18px;margin-left:4px}
.marquee{grid-area:title;justify-self:center;text-align:center;min-width:0;padding-top:4px}
.marquee h1{
  margin:6px 0 0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(32px,5.2vw,66px);line-height:1.08;text-wrap:balance;
  text-shadow:0 0 28px rgba(255,123,28,.42), 0 4px 0 var(--drop);
}
.marquee h1 .emoji{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;text-shadow:none}
.tally-btn{
  grid-area:tally;justify-self:end;display:inline-flex;align-items:center;gap:8px;
  padding:12px 18px;border:0;border-radius:16px;cursor:pointer;
  background:var(--pumpkin);color:var(--candy-ink);font-weight:700;font-size:16px;white-space:nowrap;
  box-shadow:0 5px 0 var(--pumpkin-deep), 0 12px 26px rgba(0,0,0,.35);transition:transform .12s, box-shadow .12s;
}
.tally-btn .ic-candy{color:var(--candy-ink)}
.tally-wrap{grid-area:tally;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.live-tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font:700 12px/1 var(--font-ui);color:var(--win);background:rgba(139,224,92,.1);border:1px solid rgba(139,224,92,.35);white-space:nowrap;
}
.live-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--win);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.live-tag.warn{color:var(--miss);background:rgba(255,97,120,.1);border-color:rgba(255,97,120,.4)}
.live-tag.warn::before{background:var(--miss);animation:none}
.home-btn{
  display:block;margin:0 auto 4px;width:44px;height:44px;padding:0;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:rgba(33,22,49,.78);
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:26px;line-height:1;transition:transform .12s;
}
@media (hover:hover){.home-btn:hover{transform:translateY(-2px) rotate(-8deg);border-color:rgba(255,123,28,.6)}}
/* viewers without edit rights follow the scorekeeper's screen and cannot change it */
.spectator .nav-btn,.spectator .home-btn,.spectator #stage .link,.spectator #stage .cta,.spectator #stage .btn-ghost,.spectator .setup-actions{display:none!important}
.spectator #stage button,.spectator .game-track button,.spectator .tile-input{pointer-events:none}
.tally-btn:hover{transform:translateY(-2px)}
.tally-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pumpkin-deep)}

.ic-candy{width:1.7em;height:.85em;flex:none;color:var(--pumpkin);vertical-align:middle}

/* ---------- stage ---------- */
.stage{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,2.2vh,22px);padding-block:10px;
}
.stage.enter > *{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.stage-head{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.round-track{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:100%}
.rdot{
  position:relative;width:20px;height:20px;padding:0;border-radius:50%;cursor:pointer;
  border:2px solid rgba(246,237,219,.28);background:transparent;transition:transform .15s;
}
@media (hover:hover){.rdot:hover{transform:scale(1.15)}}
.rdot.done{background:var(--c);border-color:var(--c)}
.rdot.fail{border-color:var(--c);border-style:dashed}
.rdot.cur{box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--moon)}
.stake{
  display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
  border:1px solid rgba(255,123,28,.45);background:rgba(255,123,28,.1);font-weight:600;
}
.stake b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1;color:var(--moon)}
.prompt{
  margin:0;font-size:clamp(16px,1.9vw,21px);color:var(--mist);text-align:center;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
}
.prompt b{color:var(--bone);font-weight:700}
.chip{
  display:inline-flex;align-items:center;padding:2px 13px;border-radius:999px;
  background:var(--c);color:var(--candy-ink);font-family:var(--font-display);font-size:1em;line-height:1.35;
}
.chip.ghost{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 2px rgba(246,237,219,.3)}

/* candy tiles */
.team-grid{display:grid;width:min(100%,1040px);grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.8vw,22px)}
.tile{
  position:relative;overflow:hidden;min-height:clamp(96px,17vh,176px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:0;border-radius:var(--radius-tile);cursor:pointer;
  background:var(--c);color:var(--candy-ink);
  font-family:var(--font-display);font-size:clamp(24px,3.6vw,46px);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.16), inset 0 5px 0 rgba(255,255,255,.3), 0 9px 0 -1px rgba(0,0,0,.45), 0 18px 32px rgba(0,0,0,.35);
  transition:transform .12s, box-shadow .12s, opacity .2s, filter .2s;
}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 80% at 18% 0%, rgba(255,255,255,.45), transparent 55%)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 14px, transparent 14px 28px)}
@media (hover:hover){.tile:hover{transform:translateY(-3px)}}
.tile:active{transform:translateY(5px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.16), inset 0 5px 0 rgba(255,255,255,.3), 0 3px 0 -1px rgba(0,0,0,.45), 0 8px 16px rgba(0,0,0,.3)}
.tile .name{position:relative;z-index:1;padding:0 16px;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance;text-align:center}
.key{
  position:absolute;top:10px;left:12px;z-index:1;width:24px;height:24px;display:grid;place-items:center;
  border-radius:8px;font:700 12px/1 var(--font-ui);background:rgba(28,16,39,.14);color:rgba(28,16,39,.72);
}
.badge{
  position:absolute;top:10px;right:12px;z-index:1;padding:6px 10px;border-radius:999px;
  font:700 13px/1 var(--font-ui);background:var(--candy-ink);color:var(--moon);
}
.team-grid.has-pick .tile:not(.picked){opacity:.55;filter:saturate(.7)}
.tile.picked{outline:4px solid var(--moon);outline-offset:4px}

.tile-input{cursor:text}
.tile-input:hover{transform:none}
.tile-input:focus-within{outline:4px solid var(--moon);outline-offset:4px}
.tile-input input{
  all:unset;display:block;box-sizing:border-box;width:100%;padding:0 16px;position:relative;z-index:1;
  text-align:center;font-family:var(--font-display);font-size:inherit;line-height:1.2;color:var(--candy-ink);
}
.tile-input input::placeholder{color:rgba(28,16,39,.45)}

.link{background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--mist);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--bone)}
.cta{
  border:0;border-radius:18px;padding:14px 34px;cursor:pointer;
  background:var(--pumpkin);color:var(--candy-ink);font-family:var(--font-display);font-size:24px;line-height:1.2;
  box-shadow:0 7px 0 var(--pumpkin-deep), 0 16px 30px rgba(0,0,0,.35);transition:transform .12s, box-shadow .12s;
}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pumpkin-deep)}
.btn-ghost{
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;
  background:var(--night-high);color:var(--bone);font-weight:600;font-size:15px;
}
.btn-ghost:hover{border-color:rgba(255,123,28,.6)}
.btn-ghost.danger{color:var(--miss);border-color:rgba(255,97,120,.4)}
.btn-danger{border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--miss);color:var(--candy-ink);font-weight:700;font-size:15px}

/* setup */
.section-label{margin:0 0 10px;font:700 13px/1.2 var(--font-ui);letter-spacing:.22em;color:var(--mist);text-align:center}
.lineup-wrap{width:min(100%,1040px)}
.lineup{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lineup li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(33,22,49,.66)}
.ln-no{font-family:var(--font-display);font-size:24px;line-height:1.1;color:var(--pumpkin)}
.ln-name{min-width:0;font-family:var(--font-display);font-size:18px;line-height:1.3}
.setup-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}

/* relay */
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.stepper li{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mist)}
.stepper li.past{color:var(--bone);border-color:rgba(246,237,219,.35)}
.stepper li.on{background:var(--bone);border-color:var(--bone);color:var(--candy-ink)}
.choice-grid{display:grid;width:min(100%,1040px);gap:clamp(12px,1.8vw,20px)}
.choice-grid.topics{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice-grid.words{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{
  position:relative;min-height:clamp(112px,21vh,196px);padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border-radius:var(--radius-tile);border:2px solid rgba(246,237,219,.2);cursor:pointer;
  background:var(--night-raised);color:var(--bone);
  font-family:var(--font-display);font-size:clamp(26px,3.2vw,42px);line-height:1.2;
  box-shadow:0 8px 0 -1px var(--drop), 0 16px 30px rgba(0,0,0,.3);transition:transform .12s, border-color .15s;
}
@media (hover:hover){.choice:hover:not(:disabled){transform:translateY(-3px);border-color:var(--pumpkin)}}
.choice:disabled{opacity:.4;cursor:not-allowed;border-style:dashed;box-shadow:none}
.choice .key{background:rgba(246,237,219,.08);color:var(--mist)}
.choice .sub{font:600 13px/1.3 var(--font-ui);color:var(--mist);text-align:center}
.choice.word{font-size:clamp(24px,2.8vw,36px)}
.choice.word.long{font-size:clamp(19px,2.1vw,27px)}
.w-text{text-wrap:balance;text-align:center;overflow-wrap:anywhere}
.choice.word:disabled .w-text{text-decoration:line-through;text-decoration-thickness:3px}
.pips{display:flex;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--pumpkin)}
.pip.used{background:transparent;box-shadow:inset 0 0 0 2px rgba(246,237,219,.3)}
.judge{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(100%,880px)}
.word-card{
  box-sizing:border-box;width:min(100%,880px);text-align:center;
  padding:clamp(18px,3.6vh,38px) 24px;border-radius:26px;
  background:var(--night-raised);border:2px solid var(--pumpkin);box-shadow:0 0 60px rgba(255,123,28,.22);
}
.wc-meta{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.wc-topic{font:700 14px/1 var(--font-ui);letter-spacing:.14em;color:var(--pumpkin)}
.wc-word{margin:12px 0 0;font-family:var(--font-display);font-size:clamp(32px,5.6vw,72px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.word-card.record .wc-word{font-size:clamp(28px,4vw,52px)}
.verdict{margin:14px 0 0;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px)}
.word-card.is-ok{border-color:var(--win);box-shadow:0 0 60px rgba(139,224,92,.18)}
.word-card.is-ok .verdict{color:var(--win)}
.word-card.is-no{border-color:var(--miss);box-shadow:0 0 60px rgba(255,97,120,.16)}
.word-card.is-no .verdict{color:var(--miss)}
.judge-actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.judge-btn{
  min-height:clamp(86px,14vh,132px);border-radius:var(--radius-tile);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-display);font-size:clamp(28px,3.6vw,44px);line-height:1.1;transition:transform .12s;
}
.judge-btn small{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--font-ui)}
.judge-btn.ok{border:0;background:var(--win);color:var(--candy-ink);box-shadow:0 8px 0 var(--win-deep), 0 16px 30px rgba(0,0,0,.3)}
.judge-btn.ok .ic-candy{color:var(--candy-ink)}
.judge-btn.no{border:2px solid var(--miss);background:var(--night-high);color:var(--miss);box-shadow:0 8px 0 var(--drop)}
@media (hover:hover){.judge-btn:hover{transform:translateY(-3px)}}
.judge-btn:active{transform:translateY(5px)}

/* final */
.notice{
  margin:0;padding:8px 14px;border-radius:12px;border:1px dashed rgba(255,97,120,.6);background:rgba(255,97,120,.08);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:15px;
}
.champion{text-align:center;animation:rise .5s ease both}
.champ-name{margin:4px 0 0;font-family:var(--font-display);font-size:clamp(40px,7vw,88px);line-height:1.05;text-wrap:balance}
.champ-name span{color:var(--c);text-shadow:0 0 40px rgba(255,229,160,.35), 0 5px 0 var(--drop)}
.champ-sub{margin:6px 0 0;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:26px;color:var(--moon)}
.ranking{list-style:none;margin:0;padding:0;width:min(100%,900px);display:flex;flex-direction:column;gap:9px}
.rank-row{
  display:grid;grid-template-columns:70px minmax(0,1.1fr) minmax(0,2fr) 120px;align-items:center;gap:14px;
  padding:9px 16px;border-radius:18px;background:var(--night-raised);border:1px solid var(--line);
}
.rk{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--mist);font-variant-numeric:tabular-nums}
.rk small{font-size:16px;margin-left:2px}
.nm{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px);line-height:1.2;overflow-wrap:anywhere}
.swatch{flex:none;width:16px;height:16px;border-radius:5px;background:var(--c)}
.bar{display:block;height:16px;border-radius:999px;background:rgba(246,237,219,.08);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);background:var(--c);border-radius:inherit}
.amt{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-family:var(--font-display);font-size:clamp(22px,2.6vw,32px);font-variant-numeric:tabular-nums}
.rank-row.veiled .nm,.rank-row.veiled .amt{color:rgba(246,237,219,.3)}
.rank-row.first{border:2px solid var(--moon);background:linear-gradient(90deg, rgba(255,229,160,.14), var(--night-raised) 60%)}
.rank-row.first .rk{color:var(--moon)}
.rank-row.just{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.rank-row.just .bar i{animation:grow .9s ease .15s both}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes grow{from{width:0}}
.final-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}

/* ---------- bottom rail ---------- */
.navbar{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"prev games next";align-items:center;gap:12px;padding-top:4px;
}
.nav-btn{
  display:inline-flex;align-items:center;gap:12px;min-width:0;max-width:100%;
  padding:8px 18px 8px 8px;border-radius:18px;border:1px solid var(--line);
  background:var(--night-raised);color:var(--bone);cursor:pointer;text-align:left;
}
.nav-btn.prev{grid-area:prev;justify-self:start}
.nav-btn.next{grid-area:next;justify-self:end;flex-direction:row-reverse;text-align:right;padding:8px 8px 8px 18px}
.nb-arrow{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:var(--night-high);color:var(--pumpkin);transition:background .15s, color .15s}
.nb-arrow svg{width:24px;height:24px}
.next .nb-arrow svg{transform:scaleX(-1)}
.nb-text{display:flex;flex-direction:column;min-width:0}
.nb-main{font-weight:700;font-size:16px;line-height:1.3}
.nb-sub{font-size:13px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){
  .nav-btn:hover{border-color:rgba(255,123,28,.6)}
  .nav-btn:hover .nb-arrow{background:var(--pumpkin);color:var(--candy-ink)}
}
.nav-btn.armed{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--candy-ink);box-shadow:0 0 0 4px rgba(255,123,28,.22), 0 10px 26px rgba(0,0,0,.35)}
.nav-btn.armed .nb-sub{color:rgba(28,16,39,.78);font-weight:600}
.nav-btn.armed .nb-arrow{background:var(--candy-ink);color:var(--pumpkin)}
.game-track{grid-area:games;display:flex;gap:12px;justify-content:center;padding-top:6px}
.gdot{
  position:relative;width:40px;height:34px;padding:0;cursor:pointer;display:grid;place-items:center;
  border-radius:48% 48% 46% 46% / 56% 56% 44% 44%;border:2px solid rgba(255,123,28,.6);
  background:linear-gradient(to top, rgba(255,123,28,.42) var(--fill,0%), transparent var(--fill,0%));
  color:var(--bone);font-weight:700;font-size:14px;transition:transform .15s;
}
.gdot::before{content:"";position:absolute;top:-7px;left:50%;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:#6FAE3E}
@media (hover:hover){.gdot:hover{transform:translateY(-2px)}}
.gdot.done{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--candy-ink)}
.gdot.cur{box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--moon)}

/* ---------- overlays ---------- */
.modal{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  background:rgba(8,4,14,.74);backdrop-filter:blur(4px);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet{
  box-sizing:border-box;width:min(100%,860px);max-height:100%;overflow:auto;
  padding:22px clamp(16px,3vw,30px);border-radius:24px;
  background:var(--night-raised);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:4px 0 0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.1}
.sheet-sub{margin:6px 0 0;color:var(--mist);font-size:14px}
.close-btn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--night-high);color:var(--bone);font-size:18px;cursor:pointer}
.board{list-style:none;margin:18px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.board-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,2fr) 96px;align-items:center;gap:12px}
.br-rank{font-family:var(--font-display);font-size:20px;color:var(--mist);text-align:center;font-variant-numeric:tabular-nums}
.br-name{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--font-display);font-size:19px;overflow-wrap:anywhere}
.br-amt{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.board .bar{height:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:680px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font-size:12px;font-weight:600;color:var(--mist);white-space:normal;vertical-align:bottom;line-height:1.3}
thead th .gno{display:block;font-family:var(--font-display);font-size:15px;color:var(--pumpkin)}
th:first-child{text-align:left;position:sticky;left:0;background:var(--night-raised)}
.tname{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--bone)}
td{font-size:16px}
td.zero{color:rgba(246,237,219,.32)}
td.total{font-family:var(--font-display);font-size:19px;color:var(--moon)}
.sheet-actions,.confirm{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}
.confirm p{margin:0;flex:1 1 260px}
.setup-actions.confirm{justify-content:center;margin-top:0;text-align:center}
.setup-actions.confirm p{flex:0 1 auto}

.intro{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 42%, rgba(255,123,28,.24), rgba(8,4,14,.95) 62%);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.intro-card{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:900px;text-align:center;animation:introIn .5s cubic-bezier(.2,1.3,.4,1) both}
.intro .eyebrow{font-size:16px;letter-spacing:.3em}
.intro h2{
  margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(44px,9vw,112px);line-height:1.05;text-wrap:balance;
  text-shadow:0 0 44px rgba(255,123,28,.55), 0 6px 0 var(--drop);
}
.intro-rule{margin:0;font-size:clamp(17px,2.2vw,24px);font-weight:600}
.intro-note{margin:0;color:var(--mist);font-size:clamp(15px,1.8vw,19px)}
.intro .cta{margin-top:10px}
@keyframes introIn{from{opacity:0;transform:scale(.86)}}

.toast{
  position:fixed;left:50%;top:32%;z-index:60;pointer-events:none;opacity:0;
  display:flex;align-items:center;gap:12px;padding:14px 26px;border-radius:22px;
  background:var(--night-high);border:2px solid var(--c, var(--pumpkin));box-shadow:0 22px 50px rgba(0,0,0,.55);
  font-family:var(--font-display);font-size:clamp(24px,3.4vw,40px);line-height:1.2;
  flex-wrap:wrap;justify-content:center;box-sizing:border-box;width:max-content;max-width:calc(100vw - 32px);
  transform:translate(-50%,-50%);
}
.toast .chip{font-size:.8em}
.toast-teams{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.toast .t-pts{color:var(--moon)}
.toast .t-miss{color:var(--miss)}
.toast.show{animation:toastPop 1.5s ease forwards}
@keyframes toastPop{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  24%{transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(-50%,-90%)}
}
@keyframes toastFade{0%,80%{opacity:1}100%{opacity:0}}

.confetti{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-40px;width:38px;color:var(--c);animation:fall linear forwards}
.cf .ic-candy{width:38px;height:19px;color:inherit}
@keyframes fall{to{transform:translateY(calc(100vh + 90px)) rotate(var(--rot))}}

/* ---------- responsive ---------- */
@media (hover:none){.key{display:none}}
@media (max-width:760px){
  .topbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"round tally" "title title"}
  .navbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"games games" "prev next"}
  .team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choice-grid.topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choice-grid.words{grid-template-columns:minmax(0,1fr)}
  .choice{min-height:96px}
  .lineup{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rank-row{grid-template-columns:52px minmax(0,1fr) auto;row-gap:8px}
  .rank-row .bar{grid-column:1 / -1;order:4}
  .board-row{grid-template-columns:24px minmax(0,1fr) auto}
  .board-row .bar{grid-column:2 / -1;order:4}
}
@media (max-width:460px){
  .lineup{grid-template-columns:minmax(0,1fr)}
  .nb-arrow{width:40px;height:40px}
  .nav-btn{gap:8px;padding-right:12px}
  .nav-btn.next{padding-left:12px}
  .judge-actions{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  .bat-wrap{display:none}
  .stage.enter > *,.champion,.intro-card,.rank-row.just,.rank-row.just .bar i{animation:none}
  .toast.show{animation:toastFade 1.6s linear forwards}
  .tile,.choice,.cta,.tally-btn,.judge-btn,.gdot,.rdot{transition:none}
}
</style>

<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-candy" viewBox="0 0 64 32">
    <path d="M21 16 L4 5 Q1.5 16 4 27 Z" fill="currentColor" opacity=".72"/>
    <path d="M43 16 L60 5 Q62.5 16 60 27 Z" fill="currentColor" opacity=".72"/>
    <circle cx="32" cy="16" r="13" fill="currentColor"/>
    <path d="M24 19 Q24 9 32 9 Q39 9 39 15 Q39 20 33 20 Q29 20 29 16" fill="none" stroke="#FFF7E6" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
  </symbol>
  <symbol id="i-bat" viewBox="0 0 64 30">
    <path d="M32 9 L29.5 3 L28 9.5 Q20 3 2 6 Q8 11 7 18 Q12 14.5 16 18.5 Q20 14 24 20 Q27 16 30 21 L32 25 L34 21 Q37 16 40 20 Q44 14 48 18.5 Q52 14.5 57 18 Q56 11 62 6 Q44 3 36 9.5 L34.5 3 Z" fill="currentColor"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="sky" aria-hidden="true">
  <div class="moon"></div>
  <span class="bat-wrap bw1"><svg viewBox="0 0 64 30"><use href="#i-bat"/></svg></span>
  <span class="bat-wrap bw2"><svg viewBox="0 0 64 30"><use href="#i-bat"/></svg></span>
  <span class="bat-wrap bw3"><svg viewBox="0 0 64 30"><use href="#i-bat"/></svg></span>
</div>

<div id="app">
  <header class="topbar">
    <div class="round-badge" id="roundBadge"></div>
    <div class="marquee" id="marquee"></div>
    <div class="tally-wrap">
      <button class="tally-btn" id="tallyBtn" type="button" data-action="tally-open"></button>
      <span class="live-tag" id="liveTag" hidden></span>
    </div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="navbar">
    <button class="nav-btn prev" id="prevBtn" type="button" data-action="prev"></button>
    <nav class="game-track" id="gameTrack" aria-label="게임 이동"></nav>
    <button class="nav-btn next" id="nextBtn" type="button" data-action="next"></button>
  </footer>
</div>

<div class="modal" id="modal" data-action="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="intro" id="intro" data-action="intro-close" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const RELAY_POINTS = 10;
  const GAMES = [
    // multi: several teams can earn candy in one round; the next button records the picked teams
    { name: '쪼개진 과자', multi: true, points: [10, 10, 10] },
    { name: '빙고판 글씨', points: [10, 10, 20] },
    { name: '딸기 바나나 사과', points: [20] },
    { name: '릴레이 몸으로 말해요', relay: true, points: Array(12).fill(RELAY_POINTS) },
    { name: '상식 퀴즈', multi: true, points: Array(16).fill(10) },
    { name: '상자 물건', multi: true, points: [10, 10, 10] },
  ];
  const TOPICS = [
    { name: '감정', points: 20, words: ['애틋함', '현타', '질투'] },
    { name: '속담', words: ['가는 말이 고와야 오는 말이 곱다', '방귀 뀐 놈이 성낸다', '뛰는 놈 위에 나는 놈 있다'] },
    { name: '할로윈', words: ['미라', '좀비', '뱀파이어'] },
    { name: '직업', words: ['아이돌', '어부', '발레리나'] },
  ];
  const DEFAULT_TEAMS = ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'];
  const QUIZ_GAME = GAMES.findIndex((game) => game.name === '상식 퀴즈');
  const STORE_KEY = 'halloween-candy-board-v1';
  const CANDY = '<svg class="ic-candy" viewBox="0 0 64 32" aria-hidden="true"><use href="#i-candy"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg>';
  const HOME_BTN = '<button type="button" class="home-btn" data-action="home" aria-label="홈 화면으로" title="홈 화면으로">🎃</button>';

  let state;
  let draft = null;          // round in progress: relay { step, team, t, w } or multi { picks }
  let remoteRelayPreview = null; // the scorekeeper's current word, shared only at the judging step
  let revealCount = 0;       // final ranking rows revealed, counted from last place
  let lockUntil = 0;         // swallows double taps right after a result is recorded
  let confirmReset = false;
  let confirmWipe = false;   // home screen "전체 초기화" asking for confirmation
  let lastFocus = null;
  let wakeLock = null;

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tc = (i) => `--c:var(--t${i + 1})`;
  const teamName = (i) => (state.teams[i] || '').trim() || DEFAULT_TEAMS[i];
  const roundCount = (g) => GAMES[g].points.length;
  const relayPoints = (topic) => TOPICS[topic]?.points || RELAY_POINTS;
  const relayPointsSummary = () => `감정 성공 ${relayPoints(0)}사탕 · 그 외 성공 ${RELAY_POINTS}사탕`;

  function relaySelection(g, r) {
    if (isSpectator()) return readRelayPreview(remoteRelayPreview, state.pos) || state.results[g][r];
    if (draft) return ['word', 'judge'].includes(draft.step) ? draft : null;
    return state.results[g][r];
  }

  // ---------- state ----------
  const freshResults = () => GAMES.map((g) => g.points.map(() => null));
  const freshState = (teams) => ({ teams: teams || DEFAULT_TEAMS.slice(), results: freshResults(), pos: { screen: 'setup' }, resume: null, hideViewerTally: false });

  function reachedQuiz(pos) {
    return !!pos && (pos.screen === 'final' || (pos.screen === 'game' && pos.g >= QUIZ_GAME));
  }
  function viewerTallyHidden() {
    return isSpectator() && (state.hideViewerTally || reachedQuiz(state.pos));
  }

  function validPos(p) {
    if (!p || typeof p !== 'object') return false;
    if (p.screen === 'setup' || p.screen === 'final') return true;
    return p.screen === 'game' && Number.isInteger(p.g) && p.g >= 0 && p.g < GAMES.length
      && Number.isInteger(p.r) && p.r >= 0 && p.r < roundCount(p.g);
  }
  function isValid(s) {
    return !!s && Array.isArray(s.teams) && s.teams.length === DEFAULT_TEAMS.length
      && Array.isArray(s.results) && s.results.length === GAMES.length
      && s.results.every((a, g) => Array.isArray(a) && a.length === roundCount(g))
      && validPos(s.pos);
  }
  // records saved before multi-select stored a single team number
  function normalize(s) {
    s.hideViewerTally = s.hideViewerTally === true || reachedQuiz(s.pos) || reachedQuiz(s.resume)
      || s.results.slice(QUIZ_GAME).some((rounds) => rounds.some((res) => res != null));
    GAMES.forEach((game, g) => {
      if (game.multi) s.results[g] = s.results[g].map((x) => (x == null ? null : Array.isArray(x) ? x : [x]));
    });
    return s;
  }
  function load() {
    try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (isValid(s)) return normalize(s); } catch (e) {}
    return freshState();
  }
  function saveLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function save() { saveLocal(); pushLive(); }

  // ---------- live sharing (Firebase Realtime Database) ----------
  // The scorekeeper opens the host link (?host=<key>) and writes the whole board to /live;
  // everyone else follows it read-only. The database rules accept a write only when it
  // carries the key, so the key lives in the host link and the rules, never in this file.
  const HOST_KEY_STORE = 'salc-host-key';
  const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  // public web config (safe to publish); kept inline so a stale cached file can't turn sync off
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyCDQ0ITMKp7VPAYLOpVGWeZw8ok9lQb_Vs',
    authDomain: 'salc-halloween-party.firebaseapp.com',
    databaseURL: 'https://salc-halloween-party-default-rtdb.firebaseio.com',
    projectId: 'salc-halloween-party',
    storageBucket: 'salc-halloween-party.firebasestorage.app',
    messagingSenderId: '1018257073299',
    appId: '1:1018257073299:web:9ce4190fb49505920e5966',
  };
  const CONNECT_TIMEOUT = 10000;
  let live = null;            // { host, write(body), refresh() }
  let writing = false, writeQueued = false, writeTimer = 0;
  let viewOnly = false;       // anyone without the host key, connected or not
  const isSpectator = () => viewOnly;

  // The link alone decides the role: ?host=<key> (or the older #host=<key>) is the scorekeeper.
  // The key stays in the address bar so "open in Safari" and refresh carry it along.
  function readHostKey() {
    try { localStorage.removeItem(HOST_KEY_STORE); } catch (e) {}   // older builds kept it per device
    const m = (location.search + location.hash).match(/host=([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }

  async function connectLive() {
    const hostKey = readHostKey();
    // viewers never touch the scores, even before or without a connection
    if (!hostKey) { state = freshState(); revealCount = 0; draft = null; }
    setSpectator(!hostKey);
    setLiveTag('실시간 연결 중…');
    const failed = () => setLiveTag(hostKey ? '실시간 연결 실패 · 이 기기에만 기록돼요' : '실시간 연결 실패 · 새로고침 해주세요', true);
    let connected = false;
    const giveUp = setTimeout(() => { if (!connected) failed(); }, CONNECT_TIMEOUT);
    let sdk;
    try {
      const [appSdk, dbSdk] = await Promise.all([import(FIREBASE_SDK + 'firebase-app.js'), import(FIREBASE_SDK + 'firebase-database.js')]);
      sdk = { ...appSdk, ...dbSdk };
    } catch (e) { clearTimeout(giveUp); failed(); return; }
    const db = sdk.getDatabase(sdk.initializeApp(FIREBASE_CONFIG));
    const liveRef = sdk.ref(db, 'live');
    live = {
      host: !!hostKey,
      write: (body) => sdk.update(sdk.ref(db), { live: body, gate: { key: hostKey, t: sdk.serverTimestamp() } }),
      refresh: () => sdk.get(liveRef).then((snap) => applyRemote(snap.val())).catch(() => {}),
    };
    sdk.onValue(liveRef, (snap) => {
      const val = snap.val();
      if (!connected) {
        connected = true;
        clearTimeout(giveUp);
        if (live.host) { setLiveTag('실시간 공유 중'); if (!val) pushLive(); }   // share what this device already has
        else setLiveTag('실시간 보기');
      }
      applyRemote(val);
    }, () => setLiveTag('실시간 연결 끊김 · 새로고침 해주세요', true));
  }
  function setLiveTag(text, warn) {
    const tag = $('#liveTag');
    tag.textContent = text;
    tag.classList.toggle('warn', !!warn);
    tag.hidden = false;
  }
  function setSpectator(on) {
    viewOnly = on;
    document.body.classList.toggle('spectator', on);
    if (on) { closeIntro(); if (!$('#modal').hidden) renderTally(); }
    render(false);
  }
  function readRelayPreview(preview, pos) {
    if (!preview || pos.screen !== 'game' || !GAMES[pos.g].relay
      || preview.g !== pos.g || preview.r !== pos.r
      || !Number.isInteger(preview.team) || preview.team < 0 || preview.team >= DEFAULT_TEAMS.length
      || !Number.isInteger(preview.t) || preview.t < 0 || preview.t >= TOPICS.length
      || !Number.isInteger(preview.w) || preview.w < 0 || preview.w >= TOPICS[preview.t].words.length) return null;
    return { g: pos.g, r: pos.r, team: preview.team, t: preview.t, w: preview.w };
  }
  function relayPreview() {
    if (!draft || draft.step !== 'judge') return null;
    return readRelayPreview({ ...draft, g: state.pos.g, r: state.pos.r }, state.pos);
  }
  function pushLive() {
    if (!live || !live.host) return;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flushLive, 120);
  }
  async function flushLive() {
    writeTimer = 0;
    if (writing) { writeQueued = true; return; }
    writing = true;
    try {
      // stored as one JSON string: the database drops nulls and reshapes arrays
      await live.write({ json: JSON.stringify({ state, reveal: revealCount, relayPreview: relayPreview() }) });
    } catch (e) {
      if (/permission/i.test(String((e && (e.code || e.message)) || ''))) {
        writing = false;
        writeQueued = false;
        live.host = false;
        setSpectator(true);
        setLiveTag('진행자 링크가 맞지 않아요 · 보기 전용', true);
        live.refresh();
        return;
      }
    }
    writing = false;
    if (writeQueued) { writeQueued = false; flushLive(); }
  }
  function applyRemote(val) {
    if (!val || !live) return;
    // a scorekeeper's own unsent changes are newer than what the database holds
    if (live.host && (writing || writeQueued || writeTimer)) return;
    let body;
    try { body = JSON.parse(val.json); } catch (e) { return; }
    if (!body || !isValid(body.state)) return;
    const next = normalize(body.state);
    const reveal = Number.isInteger(body.reveal) ? body.reveal : 0;
    const preview = live.host ? null : readRelayPreview(body.relayPreview, next.pos);
    const previewChanged = !live.host && JSON.stringify(preview) !== JSON.stringify(remoteRelayPreview);
    if (JSON.stringify(next) === JSON.stringify(state) && reveal === revealCount && !previewChanged) return;
    const old = state;
    const posChanged = JSON.stringify(old.pos) !== JSON.stringify(next.pos);
    const revealChanged = reveal !== revealCount;
    state = next;
    revealCount = reveal;
    remoteRelayPreview = preview;
    saveLocal();
    if (posChanged) draft = null;
    render(posChanged);
    if (!$('#modal').hidden) renderTally();
    if (!live.host) {
      announce(old, next);
      if (revealChanged && revealCount === DEFAULT_TEAMS.length) confetti();
    }
  }
  // show viewers the same "+10" toast the scorekeeper saw for a newly recorded round
  function announce(old, next) {
    for (let g = 0; g < GAMES.length; g++) {
      for (let r = 0; r < roundCount(g); r++) {
        const now = next.results[g][r];
        if (now == null || JSON.stringify(now) === JSON.stringify(old.results[g][r])) continue;
        const relay = GAMES[g].relay;
        const teams = relay ? [now.team] : Array.isArray(now) ? now : [now];
        showToast(teams, relay ? relayPoints(now.t) : GAMES[g].points[r], relay ? now.ok : true);
        return;
      }
    }
  }

  // ---------- scoring ----------
  function awards(g, r) {
    const res = state.results[g][r];
    if (res == null) return [];
    const pts = GAMES[g].points[r];
    if (GAMES[g].relay) return [{ team: res.team, pts: res.ok ? relayPoints(res.t) : 0 }];
    return (Array.isArray(res) ? res : [res]).map((team) => ({ team, pts }));
  }
  function scoreTable() {
    const table = DEFAULT_TEAMS.map(() => GAMES.map(() => 0));
    GAMES.forEach((game, g) => game.points.forEach((_, r) => {
      awards(g, r).forEach((a) => { table[a.team][g] += a.pts; });
    }));
    return table;
  }
  function standings() {
    const totals = scoreTable().map((row) => row.reduce((a, b) => a + b, 0));
    const order = totals.map((t, i) => ({ i, t })).sort((a, b) => b.t - a.t || a.i - b.i);
    order.forEach((o) => { o.rank = 1 + totals.filter((x) => x > o.t).length; });
    return { totals, order, max: Math.max(...totals) };
  }
  function missingRounds() {
    const out = [];
    state.results.forEach((rounds, g) => rounds.forEach((res, r) => { if (res == null) out.push({ g, r }); }));
    return out;
  }
  function usedWords(g, exceptR) {
    const map = {};
    state.results[g].forEach((res, r) => { if (res && r !== exceptR) map[res.t + '-' + res.w] = { r, team: res.team }; });
    return map;
  }
  function pointsSummary(g) {
    const game = GAMES[g], pts = game.points;
    if (game.relay) return relayPointsSummary();
    if (pts.length === 1) return `우승 팀 ${pts[0]}사탕`;
    if (pts.every((p) => p === pts[0])) return `라운드마다 ${pts[0]}사탕`;
    const parts = [];
    let s = 0;
    for (let i = 1; i <= pts.length; i++) {
      if (i === pts.length || pts[i] !== pts[s]) {
        parts.push(`${s === i - 1 ? s + 1 : `${s + 1}–${i}`}R ${pts[s]}사탕`);
        s = i;
      }
    }
    return parts.join(' · ');
  }
  const roundsText = (g) => (roundCount(g) === 1 ? '단판 승부' : `${roundCount(g)}라운드`);

  // ---------- navigation ----------
  function nextPos(p) {
    if (p.screen === 'setup') return { screen: 'game', g: 0, r: 0 };
    if (p.screen === 'final') return null;
    if (p.r < roundCount(p.g) - 1) return { screen: 'game', g: p.g, r: p.r + 1 };
    if (p.g < GAMES.length - 1) return { screen: 'game', g: p.g + 1, r: 0 };
    return { screen: 'final' };
  }
  function prevPos(p) {
    if (p.screen === 'setup') return null;
    if (p.screen === 'final') { const g = GAMES.length - 1; return { screen: 'game', g, r: roundCount(g) - 1 }; }
    if (p.r > 0) return { screen: 'game', g: p.g, r: p.r - 1 };
    if (p.g > 0) return { screen: 'game', g: p.g - 1, r: roundCount(p.g - 1) - 1 };
    return { screen: 'setup' };
  }
  function goTo(to) {
    const from = state.pos;
    if (to.screen === 'setup' && from.screen !== 'setup') state.resume = from;
    if (to.screen === 'final' && from.screen !== 'final') revealCount = 0;
    state.pos = to;
    if (reachedQuiz(to)) state.hideViewerTally = true;
    draft = null;
    confirmWipe = false;
    save();
    render(true);
    const enteringGame = to.screen === 'game' && to.r === 0
      && (from.screen === 'setup' || (from.screen === 'game' && to.g > from.g));
    if (enteringGame) showIntro(to.g);
  }
  function goNext() {
    if (Date.now() < lockUntil) return;
    const p = state.pos;
    if (p.screen === 'final') { revealNext(); return; }
    const to = nextPos(p);
    if (!to) return;
    if (p.screen === 'game' && GAMES[p.g].multi && draft && draft.picks) {
      const picks = draft.picks.slice().sort((a, b) => a - b);
      const old = (state.results[p.g][p.r] || []).slice().sort((a, b) => a - b);
      const changed = picks.join() !== old.join();
      state.results[p.g][p.r] = picks.length ? picks : null;
      if (changed && picks.length) showToast(picks, GAMES[p.g].points[p.r], true);
      if (changed || picks.length) lockUntil = Date.now() + 650;
    }
    goTo(to);
  }
  function locked(ms) {
    const now = Date.now();
    if (now < lockUntil) return true;
    lockUntil = now + ms;
    return false;
  }

  // ---------- recording ----------
  function recordWin(team) {
    if (locked(650)) return;
    const { g, r } = state.pos;
    state.results[g][r] = team;
    showToast([team], GAMES[g].points[r], true);
    goTo(nextPos(state.pos));
  }
  function recordRelay(ok) {
    if (locked(650)) return;
    const { g, r } = state.pos;
    state.results[g][r] = { team: draft.team, t: draft.t, w: draft.w, ok };
    showToast([draft.team], ok ? relayPoints(draft.t) : 0, ok);
    goTo(nextPos(state.pos));
  }
  function relayBack() {
    if (!draft || !draft.step) return;
    const res = state.results[state.pos.g][state.pos.r];
    if (draft.step === 'team') { if (res) draft = null; else return; }
    else if (draft.step === 'topic') draft = { step: 'team' };
    else if (draft.step === 'word') draft.step = 'topic';
    else draft.step = 'word';
    render(true);
    pushLive();
  }

  // ---------- rendering ----------
  function render(animate) {
    renderTop();
    renderStage(animate);
    renderNav();
  }

  function renderTop() {
    const p = state.pos;
    const badge = $('#roundBadge'), marquee = $('#marquee');
    if (p.screen === 'game') {
      badge.innerHTML = `<span class="rb-label">ROUND</span><span class="rb-val"><b>${p.r + 1}</b>/${roundCount(p.g)}<small>라운드</small></span>`;
      marquee.innerHTML = `${HOME_BTN}<p class="eyebrow">GAME ${p.g + 1} / ${GAMES.length}</p><h1>${esc(GAMES[p.g].name)}</h1>`;
    } else if (p.screen === 'final') {
      badge.innerHTML = `<span class="rb-label">ROUND</span><span class="rb-val"><small>모든 게임 끝</small></span>`;
      marquee.innerHTML = `${HOME_BTN}<p class="eyebrow">FINAL</p><h1>최종 결과</h1>`;
    } else {
      badge.innerHTML = `<span class="rb-label">READY</span><span class="rb-val"><small>팀 설정</small></span>`;
      marquee.innerHTML = `<h1>SALC 할로윈 파티 <span class="emoji">🎃</span></h1>`;
    }
    $('#tallyBtn').innerHTML = `${CANDY}<span>${p.screen === 'final' ? '전체 집계' : '중간 집계'}</span>`;
    $('#tallyBtn').hidden = viewerTallyHidden();
    if (viewerTallyHidden() && !$('#modal').hidden) closeModal();
  }

  function renderStage(animate) {
    const p = state.pos, stage = $('#stage');
    stage.className = 'stage';
    stage.innerHTML = p.screen === 'setup' ? setupHTML()
      : p.screen === 'final' ? finalHTML()
      : GAMES[p.g].relay ? relayHTML(p.g, p.r)
      : gameHTML(p.g, p.r);
    if (animate) { void stage.offsetWidth; stage.classList.add('enter'); }
  }

  function navLabel(dir, to) {
    const p = state.pos;
    if (to.screen === 'setup') return ['팀 설정', '팀 이름 바꾸기'];
    if (to.screen === 'final') return ['최종 결과', '모든 게임 끝'];
    const same = p.screen === 'game' && to.g === p.g;
    const main = (dir < 0 ? '이전 ' : '다음 ') + (same ? '라운드' : '게임');
    const sub = same ? `${to.r + 1}/${roundCount(to.g)}라운드` : `${GAMES[to.g].name} ${to.r + 1}R`;
    return [main, sub];
  }
  function navInner(dir, to, subOverride) {
    const [main, sub] = navLabel(dir, to);
    return `<span class="nb-arrow">${ARROW}</span><span class="nb-text"><span class="nb-main">${main}</span><span class="nb-sub">${esc(subOverride || sub)}</span></span>`;
  }
  function renderNav() {
    const p = state.pos;
    const prev = prevPos(p);
    const next = p.screen === 'setup' ? null : nextPos(p);
    const picks = p.screen === 'game' && GAMES[p.g].multi && draft && draft.picks ? draft.picks.length : 0;
    const pb = $('#prevBtn'), nb = $('#nextBtn');
    pb.hidden = !prev;
    nb.hidden = !next;
    nb.classList.toggle('armed', picks > 0);
    if (prev) pb.innerHTML = navInner(-1, prev);
    if (next) nb.innerHTML = navInner(1, next, picks ? `${picks}개 팀 +${GAMES[p.g].points[p.r]}사탕` : '');
    $('#gameTrack').innerHTML = GAMES.map((game, g) => {
      const n = roundCount(g);
      const done = state.results[g].filter((x) => x != null).length;
      const cur = p.screen === 'game' && p.g === g;
      const label = `${g + 1}번 게임: ${game.name} (기록 ${done}/${n})`;
      return `<button type="button" class="gdot${done === n ? ' done' : ''}${cur ? ' cur' : ''}" style="--fill:${Math.round((done / n) * 100)}%" data-action="jump-game" data-g="${g}" title="${esc(label)}" aria-label="${esc(label)}"${cur ? ' aria-current="step"' : ''}>${g + 1}</button>`;
    }).join('');
  }

  function teamTile(i, action, cls, badge, pressed) {
    const aria = pressed === undefined ? '' : ` aria-pressed="${pressed}"`;
    return `<button type="button" class="tile${cls ? ' ' + cls : ''}" style="${tc(i)}" data-action="${action}" data-team="${i}" data-hotkey="${i + 1}"${aria}><span class="key" aria-hidden="true">${i + 1}</span>${badge || ''}<span class="name">${esc(teamName(i))}</span></button>`;
  }
  function trackHTML(g) {
    const relay = GAMES[g].relay;
    return `<div class="round-track" aria-label="라운드 진행">${GAMES[g].points.map((_, r) => {
      const res = state.results[g][r];
      let cls = 'rdot', style = '', label = `${r + 1}라운드`;
      if (res != null) {
        const teams = relay ? [res.team] : Array.isArray(res) ? res : [res];
        const failed = relay && !res.ok;
        style = teams.length === 1
          ? ` style="${tc(teams[0])}"`
          : ` style="border-color:transparent;background:conic-gradient(${teams.map((t, k) => `var(--t${t + 1}) ${(k / teams.length) * 100}% ${((k + 1) / teams.length) * 100}%`).join(', ')})"`;
        cls += failed ? ' fail' : ' done';
        label += ` · ${teams.map((t) => teamName(t)).join(', ')} ${relay ? (failed ? '실패' : '성공') : GAMES[g].multi ? '획득' : '승리'}`;
      } else {
        label += ' · 기록 없음';
      }
      if (r === state.pos.r) cls += ' cur';
      return `<button type="button" class="${cls}"${style} data-action="jump-round" data-r="${r}" title="${esc(label)}" aria-label="${esc(label)}"></button>`;
    }).join('')}</div>`;
  }
  function stakeHTML(g, r) {
    if (GAMES[g].relay) {
      const selection = relaySelection(g, r);
      return selection
        ? `<div class="stake">성공하면 ${CANDY}<b>${relayPoints(selection.t)}</b>사탕</div>`
        : `<div class="stake">${CANDY}${relayPointsSummary()}</div>`;
    }
    return `<div class="stake">${GAMES[g].relay ? '성공하면' : '이번 라운드'} ${CANDY}<b>${GAMES[g].points[r]}</b>사탕</div>`;
  }

  // where "게임으로 돌아가기" leads: the screen open when the home button was pressed
  function resumePos() {
    const back = state.resume;
    return back && validPos(back) && back.screen !== 'setup' ? back : null;
  }
  function setupHTML() {
    const spectator = isSpectator();
    return `${spectator ? '' : '<p class="prompt">팀 이름을 눌러서 바꿀 수 있어요</p>'}
      <div class="team-grid">${DEFAULT_TEAMS.map((d, i) => `<label class="tile tile-input" style="${tc(i)}" for="team-name-${i}"><span class="key" aria-hidden="true">${i + 1}</span><input id="team-name-${i}" data-team-input="${i}" value="${esc(state.teams[i])}" placeholder="${d}" maxlength="10" autocomplete="off" spellcheck="false" aria-label="${i + 1}번 팀 이름"${spectator ? ' readonly' : ''}></label>`).join('')}</div>
      <section class="lineup-wrap" aria-labelledby="lineupTitle">
        <h2 class="section-label" id="lineupTitle">오늘의 게임</h2>
        <ol class="lineup">${GAMES.map((game, g) => `<li><span class="ln-no">${g + 1}</span><span class="ln-name">${esc(game.name)}</span></li>`).join('')}</ol>
      </section>
      ${confirmWipe
        ? `<div class="setup-actions confirm"><p>모든 점수와 팀 이름을 처음 상태로 되돌릴까요?</p><button type="button" class="btn-ghost" data-action="wipe-cancel">취소</button><button type="button" class="btn-danger" data-action="wipe-confirm">전체 초기화</button></div>`
        : `<div class="setup-actions">
        <button type="button" class="cta" data-action="start">${resumePos() ? '게임으로 돌아가기' : '게임 시작'}</button>
        <button type="button" class="btn-ghost" data-action="fullscreen">전체 화면</button>
        <button type="button" class="btn-ghost danger" data-action="wipe-ask">전체 초기화</button>
      </div>`}`;
  }

  function gameHTML(g, r) {
    const res = state.results[g][r];
    const pts = GAMES[g].points[r];
    const head = `<div class="stage-head">${trackHTML(g)}${stakeHTML(g, r)}</div>`;
    if (GAMES[g].multi) {
      if (!draft) draft = { picks: Array.isArray(res) ? res.slice() : res != null ? [res] : [] };
      const picks = draft.picks;
      return `${head}
        <div class="team-grid${picks.length ? ' has-pick' : ''}">${DEFAULT_TEAMS.map((_, i) => {
          const on = picks.includes(i);
          return teamTile(i, 'pick', on ? 'picked' : '', on ? `<span class="badge">+${pts}</span>` : '', on);
        }).join('')}</div>`;
    }
    const has = res != null;
    return `${head}
      <div class="team-grid${has ? ' has-pick' : ''}">${DEFAULT_TEAMS.map((_, i) => teamTile(i, 'win', res === i ? 'picked' : '', res === i ? `<span class="badge">+${pts}</span>` : '')).join('')}</div>
      ${has ? '<button type="button" class="link" data-action="clear">이 라운드 기록 지우기</button>' : ''}`;
  }

  function relayHTML(g, r) {
    const res = state.results[g][r];
    const pts = relayPoints(relaySelection(g, r)?.t);
    const head = `<div class="stage-head">${trackHTML(g)}${stakeHTML(g, r)}</div>`;
    if (isSpectator()) {
      const preview = readRelayPreview(remoteRelayPreview, state.pos);
      if (preview) {
        const topic = TOPICS[preview.t];
        return `${head}
          <div class="word-card">
            <p class="wc-meta"><span class="chip" style="${tc(preview.team)}">${esc(teamName(preview.team))}</span><span class="wc-topic">${topic.name}</span></p>
            <p class="wc-word">${esc(topic.words[preview.w])}</p>
          </div>
          <p class="prompt">진행자가 성공·실패를 판정하고 있어요</p>`;
      }
      if (!res) return `${head}<p class="prompt">진행자가 제시어를 고르고 있어요</p>`;
    }
    if (!draft && res) {
      const topic = TOPICS[res.t];
      return `${head}
        <div class="word-card record ${res.ok ? 'is-ok' : 'is-no'}">
          <p class="wc-meta"><span class="chip" style="${tc(res.team)}">${esc(teamName(res.team))}</span><span class="wc-topic">${topic.name}</span></p>
          <p class="wc-word">${esc(topic.words[res.w])}</p>
          <p class="verdict">${res.ok ? `성공 ${CANDY} +${pts}사탕` : '실패 · 사탕 없음'}</p>
        </div>
        <div class="setup-actions"><button type="button" class="btn-ghost" data-action="relay-redo">다시 기록하기</button><button type="button" class="link" data-action="clear">이 라운드 기록 지우기</button></div>`;
    }
    if (!draft) draft = { step: 'team' };
    const steps = [['team', '팀'], ['topic', '주제'], ['word', '제시어'], ['judge', '성공/실패']];
    const at = steps.findIndex((s) => s[0] === draft.step);
    const stepper = `<ol class="stepper">${steps.map(([, label], i) => `<li class="${i < at ? 'past' : i === at ? 'on' : ''}"${i === at ? ' aria-current="step"' : ''}>${i + 1}. ${label}</li>`).join('')}</ol>`;
    const used = usedWords(g, r);
    const chip = draft.team != null ? `<span class="chip" style="${tc(draft.team)}">${esc(teamName(draft.team))}</span>` : '';
    let body;
    if (draft.step === 'team') {
      body = `<div class="team-grid">${DEFAULT_TEAMS.map((_, i) => teamTile(i, 'relay-team')).join('')}</div>
        ${res ? '<button type="button" class="link" data-action="relay-back">← 원래 기록 그대로 두기</button>' : ''}`;
    } else if (draft.step === 'topic') {
      body = `<p class="prompt">${chip}</p>
        <div class="choice-grid topics">${TOPICS.map((t, ti) => {
          const left = t.words.filter((_, wi) => !used[ti + '-' + wi]).length;
          return `<button type="button" class="choice" data-action="relay-topic" data-topic="${ti}" data-hotkey="${ti + 1}"${left ? '' : ' disabled'}><span class="key" aria-hidden="true">${ti + 1}</span><span>${t.name}</span><span class="pips" aria-hidden="true">${t.words.map((_, wi) => `<i class="pip${used[ti + '-' + wi] ? ' used' : ''}"></i>`).join('')}</span><span class="sub">${left ? `남은 제시어 ${left}개` : '제시어를 모두 썼어요'}</span></button>`;
        }).join('')}</div>
        <button type="button" class="link" data-action="relay-back">← 팀 다시 고르기</button>`;
    } else if (draft.step === 'word') {
      const topic = TOPICS[draft.t];
      body = `<p class="prompt">${chip}<span class="chip ghost">${topic.name}</span></p>
        <div class="choice-grid words">${topic.words.map((w, wi) => {
          const u = used[draft.t + '-' + wi];
          return `<button type="button" class="choice word${w.length > 8 ? ' long' : ''}" data-action="relay-word" data-word="${wi}" data-hotkey="${wi + 1}"${u ? ' disabled' : ''}><span class="key" aria-hidden="true">${wi + 1}</span><span class="w-text">${esc(w)}</span>${u ? `<span class="sub">${u.r + 1}라운드 ${esc(teamName(u.team))} 사용</span>` : ''}</button>`;
        }).join('')}</div>
        <button type="button" class="link" data-action="relay-back">← 주제 다시 고르기</button>`;
    } else {
      const topic = TOPICS[draft.t];
      body = `<div class="judge">
          <div class="word-card"><p class="wc-meta">${chip}<span class="wc-topic">${topic.name}</span></p><p class="wc-word">${esc(topic.words[draft.w])}</p></div>
          <div class="judge-actions">
            <button type="button" class="judge-btn ok" data-action="relay-judge" data-ok="1">성공<small>${CANDY}+${pts}사탕</small></button>
            <button type="button" class="judge-btn no" data-action="relay-judge" data-ok="0">실패<small>사탕 없음</small></button>
          </div>
          <button type="button" class="link" data-action="relay-back">← 제시어 다시 고르기</button>
        </div>`;
    }
    return head + stepper + body;
  }

  function finalHTML() {
    const { order, max } = standings();
    const n = order.length;
    const allShown = revealCount >= n;
    const missing = missingRounds();
    const rows = order.map((o, idx) => {
      const shown = idx >= n - revealCount;
      if (!shown) {
        return `<li class="rank-row veiled"><span class="rk">${idx + 1}<small>위</small></span><span class="nm">???</span><span class="bar"><i></i></span><span class="amt">?</span></li>`;
      }
      const cls = `rank-row${o.rank === 1 ? ' first' : ''}${o.rank === order[n - revealCount]?.rank ? ' just' : ''}`;
      return `<li class="${cls}" style="${tc(o.i)};--w:${max ? (o.t / max) * 100 : 0}%"><span class="rk">${o.rank}<small>위</small></span><span class="nm"><i class="swatch"></i>${esc(teamName(o.i))}</span><span class="bar"><i></i></span><span class="amt">${o.t}${CANDY}</span></li>`;
    }).join('');
    let champion = '';
    if (allShown) {
      const winners = order.filter((o) => o.rank === 1);
      champion = `<div class="champion"><p class="eyebrow">${winners.length > 1 ? '공동 우승' : '우승'}</p><p class="champ-name">${winners.map((w) => `<span style="${tc(w.i)}">${esc(teamName(w.i))}</span>`).join(' · ')}</p><p class="champ-sub">사탕 ${CANDY}${winners[0].t}개</p></div>`;
    }
    const actions = allShown
      ? `<button type="button" class="btn-ghost" data-action="tally-open">게임별 점수 보기</button><button type="button" class="link" data-action="reveal-reset">처음부터 다시 공개</button>`
      : `<button type="button" class="cta" data-action="reveal">${n - revealCount}위 공개</button><button type="button" class="link" data-action="reveal-all">한 번에 모두 공개</button>`;
    const notice = missing.length
      ? `<p class="notice">기록되지 않은 라운드가 ${missing.length}개 있어요 <button type="button" class="link" data-action="jump-missing">첫 빈 라운드로 가기</button></p>`
      : '';
    return `${notice}${champion}<ol class="ranking">${rows}</ol><div class="final-actions">${actions}</div>`;
  }

  // ---------- tally sheet ----------
  function progressText() {
    const p = state.pos;
    if (p.screen === 'game') return `지금 ${p.g + 1}번 게임 「${GAMES[p.g].name}」 ${p.r + 1}/${roundCount(p.g)}라운드`;
    if (p.screen === 'final') return '모든 게임이 끝났어요';
    return '아직 게임 시작 전이에요';
  }
  function tallyHTML() {
    const table = scoreTable();
    const { totals, order, max } = standings();
    const isFinal = state.pos.screen === 'final';
    const board = order.map((o) => `<li class="board-row" style="${tc(o.i)};--w:${max ? (o.t / max) * 100 : 0}%"><span class="br-rank">${o.rank}</span><span class="br-name"><i class="swatch"></i>${esc(teamName(o.i))}</span><span class="bar"><i></i></span><span class="br-amt">${o.t}${CANDY}</span></li>`).join('');
    const head = GAMES.map((game, g) => `<th scope="col"><span class="gno">${g + 1}</span>${esc(game.name)}</th>`).join('');
    const rows = DEFAULT_TEAMS.map((_, i) => `<tr><th scope="row"><span class="tname" style="${tc(i)}"><i class="swatch"></i>${esc(teamName(i))}</span></th>${table[i].map((v) => `<td${v ? '' : ' class="zero"'}>${v}</td>`).join('')}<td class="total">${totals[i]}</td></tr>`).join('');
    const actions = isSpectator()
      ? `<div class="sheet-actions"><button type="button" class="btn-ghost" data-action="fullscreen">전체 화면</button></div>`
      : confirmReset
      ?`<div class="confirm"><p>모든 점수 기록을 지우고 처음으로 돌아갈까요? 팀 이름은 그대로 남아요.</p><button type="button" class="btn-ghost" data-action="reset-cancel">취소</button><button type="button" class="btn-danger" data-action="reset-confirm">기록 지우기</button></div>`
      : `<div class="sheet-actions"><button type="button" class="btn-ghost" data-action="edit-teams">팀 이름 바꾸기</button><button type="button" class="btn-ghost" data-action="fullscreen">전체 화면</button><button type="button" class="btn-ghost danger" data-action="reset-ask">처음부터 다시</button></div>`;
    return `<div class="sheet-head"><div><p class="eyebrow">${isFinal ? 'TOTAL' : 'SO FAR'}</p><h2 id="sheetTitle">${isFinal ? '전체 집계' : '중간 집계'}</h2><p class="sheet-sub">${esc(progressText())}</p></div><button type="button" class="close-btn" data-action="modal-close" aria-label="닫기">✕</button></div>
      <ol class="board">${board}</ol>
      <div class="table-wrap"><table><thead><tr><th scope="col">팀</th>${head}<th scope="col">합계</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${actions}`;
  }
  function renderTally() { $('#sheet').innerHTML = tallyHTML(); }
  function openTally() {
    if (viewerTallyHidden()) return;
    confirmReset = false;
    lastFocus = document.activeElement;
    renderTally();
    $('#modal').hidden = false;
    $('#sheet .close-btn').focus();
  }
  function closeModal() {
    $('#modal').hidden = true;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }

  // ---------- overlays & effects ----------
  function showIntro(g) {
    const game = GAMES[g];
    const rule = game.relay
      ? `${roundsText(g)} · 주제 ${TOPICS.length}개 · ${relayPointsSummary()}`
      : `${roundsText(g)} · ${pointsSummary(g)}`;
    const el = $('#intro');
    el.innerHTML = `<div class="intro-card" role="dialog" aria-modal="true" aria-label="${g + 1}번 게임 시작"><p class="eyebrow">GAME ${g + 1} / ${GAMES.length}</p><h2>${esc(game.name)}</h2><p class="intro-rule">${rule}</p>${game.relay ? '<p class="intro-note">한 번 나온 제시어는 다시 고를 수 없어요</p>' : ''}<button type="button" class="cta">시작하기</button></div>`;
    el.hidden = false;
    el.querySelector('.cta').focus();
  }
  function closeIntro() { $('#intro').hidden = true; }

  function showToast(teams, pts, ok) {
    const t = $('#toast');
    t.setAttribute('style', teams.length === 1 ? tc(teams[0]) : '');
    t.innerHTML = `<span class="toast-teams">${teams.map((i) => `<span class="chip" style="${tc(i)}">${esc(teamName(i))}</span>`).join('')}</span>${ok ? `<span class="t-pts">+${pts}</span>${CANDY}` : '<span class="t-miss">실패</span>'}`;
    t.classList.remove('show');
    void t.offsetWidth;
    t.classList.add('show');
  }

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.createElement('div');
    box.className = 'confetti';
    for (let k = 0; k < 48; k++) {
      const s = document.createElement('span');
      s.className = 'cf';
      s.style.left = Math.random() * 100 + '%';
      s.style.setProperty('--c', `var(--t${1 + (k % 6)})`);
      s.style.setProperty('--rot', Math.round(Math.random() * 720 - 360) + 'deg');
      s.style.animationDuration = (2.6 + Math.random() * 2.2).toFixed(2) + 's';
      s.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
      s.innerHTML = CANDY;
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 6000);
  }
  function revealNext() {
    const { order } = standings();
    const n = order.length;
    if (revealCount >= n) return;
    const rank = order[n - 1 - revealCount].rank;
    do { revealCount++; } while (revealCount < n && order[n - 1 - revealCount].rank === rank);
    renderStage(false);
    pushLive();
    if (revealCount === n) confetti();
  }

  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  async function requestWake() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
  }

  // ---------- events ----------
  const VIEWER_ACTIONS = new Set(['tally-open', 'modal-close', 'backdrop', 'intro-close', 'fullscreen']);
  document.addEventListener('click', (e) => {
    requestWake();
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    if (isSpectator() && !VIEWER_ACTIONS.has(el.dataset.action)) return;
    const p = state.pos;
    switch (el.dataset.action) {
      case 'start': goTo(resumePos() || { screen: 'game', g: 0, r: 0 }); break;
      case 'home': goTo({ screen: 'setup' }); break;
      case 'wipe-ask': confirmWipe = true; renderStage(false); break;
      case 'wipe-cancel': confirmWipe = false; renderStage(false); break;
      case 'wipe-confirm':
        state = freshState();
        draft = null;
        revealCount = 0;
        confirmWipe = false;
        save();
        render(true);
        break;
      case 'win': recordWin(+el.dataset.team); break;
      case 'pick': {
        if (!draft || !draft.picks) break;
        const t = +el.dataset.team;
        const at = draft.picks.indexOf(t);
        if (at >= 0) draft.picks.splice(at, 1);
        else draft.picks.push(t);
        renderStage(false);
        renderNav();
        break;
      }
      case 'clear': state.results[p.g][p.r] = null; draft = null; save(); render(true); break;
      case 'prev': { const to = prevPos(p); if (to) goTo(to); break; }
      case 'next': goNext(); break;
      case 'jump-round': goTo({ screen: 'game', g: p.g, r: +el.dataset.r }); break;
      case 'jump-game': goTo({ screen: 'game', g: +el.dataset.g, r: 0 }); break;
      case 'jump-missing': { const m = missingRounds()[0]; if (m) goTo({ screen: 'game', g: m.g, r: m.r }); break; }
      case 'relay-team': if (!locked(300)) { draft = { step: 'topic', team: +el.dataset.team }; render(true); } break;
      case 'relay-topic': if (!locked(300)) { draft.t = +el.dataset.topic; draft.step = 'word'; render(true); } break;
      case 'relay-word': if (!locked(300)) { draft.w = +el.dataset.word; draft.step = 'judge'; render(true); pushLive(); } break;
      case 'relay-judge': recordRelay(el.dataset.ok === '1'); break;
      case 'relay-back': relayBack(); break;
      case 'relay-redo': draft = { step: 'team' }; render(true); pushLive(); break;
      case 'tally-open': openTally(); break;
      case 'modal-close': closeModal(); break;
      case 'backdrop': if (e.target === el) closeModal(); break;
      case 'edit-teams': closeModal(); goTo({ screen: 'setup' }); break;
      case 'reset-ask': confirmReset = true; renderTally(); break;
      case 'reset-cancel': confirmReset = false; renderTally(); break;
      case 'reset-confirm':
        state = freshState(state.teams.slice());
        draft = null;
        revealCount = 0;
        save();
        closeModal();
        render(true);
        break;
      case 'reveal': revealNext(); break;
      case 'reveal-all': revealCount = DEFAULT_TEAMS.length; renderStage(false); pushLive(); confetti(); break;
      case 'reveal-reset': revealCount = 0; renderStage(true); pushLive(); break;
      case 'intro-close': if (Date.now() >= lockUntil) closeIntro(); break;
      case 'fullscreen': toggleFullscreen(); break;
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-team-input]');
    if (!el) return;
    state.teams[+el.dataset.teamInput] = el.value;
    save();
  });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (isSpectator()) {
      if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
      return;
    }
    if (!$('#intro').hidden) {
      if (['Enter', ' ', 'Escape', 'ArrowRight', 'PageDown'].includes(e.key)) {
        e.preventDefault();
        if (Date.now() >= lockUntil) closeIntro();
      }
      return;
    }
    if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
    const p = state.pos;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      const to = prevPos(p);
      if (to) goTo(to);
    } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      goNext();
    } else if (/^[1-6]$/.test(e.key)) {
      const b = document.querySelector(`#stage [data-hotkey="${e.key}"]:not([disabled])`);
      if (b) { e.preventDefault(); b.click(); }
    } else if (e.key === 'Backspace' && draft && draft.step) {
      e.preventDefault();
      relayBack();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.pos.screen !== 'setup') requestWake();
  });

  // ---------- boot ----------
  state = load();
  render(false);
  connectLive();
})();
</script>
</body>
</html>
